name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: taskflow-production
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  build-images:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      api-image: ${{ steps.image.outputs.api }}
      web-image: ${{ steps.image.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: |
          echo "api=ghcr.io/${GITHUB_REPOSITORY,,}/api:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${GITHUB_REPOSITORY,,}/web:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.image.outputs.api }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: ${{ steps.image.outputs.web }}
          build-args: VITE_API_URL=/api/v1

  deploy:
    needs: build-images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          test -n "$PROD_SSH_KEY"
          test -n "$PROD_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$PROD_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy immutable image
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          API_IMAGE: ${{ needs.build-images.outputs.api-image }}
          WEB_IMAGE: ${{ needs.build-images.outputs.web-image }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh "$PROD_USER@$PROD_HOST" "sudo docker login ghcr.io --username '$GHCR_USER' --password-stdin"
          ssh "$PROD_USER@$PROD_HOST" "cd /opt/TaskFlow && git fetch --all --prune && git checkout '$GITHUB_SHA' && chmod +x ops/deploy/deploy-production.sh && sudo ops/deploy/deploy-production.sh '$API_IMAGE' '$WEB_IMAGE'"
