name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  web-backend-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm --prefix backend ci
      - run: npm --prefix backend run db:generate
      - run: npm --prefix backend run db:validate
        env:
          DATABASE_URL: postgresql://taskflow:validation@127.0.0.1:5432/taskflow
      - name: Typecheck frontend
        run: npm run typecheck
      - name: Build frontend
        run: npm run build
      - name: Build backend
        run: npm --prefix backend run build
      - name: Test account security
        run: node --test scripts/account-security.test.mjs
      - name: Test API result handling
        run: node --test scripts/api-result-core.test.mjs
      - name: Test auth session handling
        run: node --test scripts/auth-session-core.test.mjs
      - name: Test database constraints
        run: node --test scripts/database-constraints.test.mjs
      - name: Test date utilities
        run: node --test scripts/date-utils.test.mjs
      - name: Test local task repository
        run: node --test scripts/local-task-repository.test.mjs
      - name: Test metrics
        run: node --test scripts/metrics.test.mjs
      - name: Test operations scripts
        run: node --test scripts/ops-scripts.test.mjs
      - name: Test performance baseline
        run: node --test scripts/performance-baseline.test.mjs
      - name: Test phase 15 regression suite
        run: node --test scripts/phase15-regression.test.mjs
      - name: Test reorder feedback
        run: node --test scripts/reorder-feedback.test.mjs
      - name: Test sync core
        run: node --test scripts/sync-core.test.mjs
      - name: Test sync state core
        run: node --test scripts/sync-state-core.test.mjs
      - name: Test task core
        run: node --test scripts/task-core.test.mjs
      - name: Test task draft core
        run: node --test scripts/task-draft-core.test.mjs
      - run: npm run test:integration
      - run: npm run test:ops-integration
      - run: npm run test:e2e
      - run: npm audit --audit-level=high
      - run: npm --prefix backend audit --audit-level=high

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ios-simulator:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run cap:sync
      - run: plutil -lint ios/App/App/Info.plist ios/App/App/PrivacyInfo.xcprivacy
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
