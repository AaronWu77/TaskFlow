
  <!DOCTYPE html>
  <html lang="en">
    <head>
      
      <meta charset="UTF-8" />
      <!-- viewport-fit=cover exposes safe area insets on iPhone notch/Dynamic Island -->
      <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
      <title>TaskFlow</title>
      <meta name="description" content="A personal task management app centered on flow — always showing you the one thing to focus on next." />
      <meta name="robots" content="noindex, nofollow" />

      <!-- PWA / Add to Home Screen -->
      <link rel="manifest" href="/manifest.json" />
      <meta name="theme-color" content="#4f46e5" />

      <!-- iOS-specific PWA meta tags -->
      <meta name="apple-mobile-web-app-capable" content="yes" />
      <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
      <meta name="apple-mobile-web-app-title" content="TaskFlow" />
      <link rel="apple-touch-icon" href="/icons/icon-192.png" />

      <style>
        html, body, #root {
          height: 100%;
          min-height: 100%;
          overflow: hidden;
        }
        body {
          height: 100%;
          min-height: 100vh;
          min-height: 100dvh;
          min-height: -webkit-fill-available;
          margin: 0;
          background-color: #f4f5f7;
        }
        #root {
          background-color: #f4f5f7;
        }
      </style>
      
    </head>

    <body>
      
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
      
    </body>
  </html>
